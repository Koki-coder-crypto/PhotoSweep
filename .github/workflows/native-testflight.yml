name: Native TestFlight delivery
on:
  push:
    tags: ['native-testflight-*']
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Unique native build number (20002 or greater)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: native-testflight-delivery
  cancel-in-progress: false
jobs:
  testflight:
    if: github.event.repository.private == false
    runs-on: macos-15
    environment: apple-distribution
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Require configured signing secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          python3 - <<'PY'
          import os
          required = ['ASC_KEY_ID','ASC_ISSUER_ID','ASC_PRIVATE_KEY','IOS_CERTIFICATE_BASE64','IOS_CERTIFICATE_PASSWORD','IOS_PROFILE_BASE64']
          missing = [name for name in required if not os.environ.get(name)]
          assert not missing, 'Configure protected secrets: ' + ', '.join(missing)
          build = os.environ.get('BUILD_NUMBER') or os.environ['GITHUB_REF_NAME'].removeprefix('native-testflight-')
          assert build.isdigit() and int(build) >= 20002
          with open(os.environ['GITHUB_ENV'], 'a') as stream: stream.write('BUILD_NUMBER='+build+'\n')
          PY
      - name: Install signing material in an ephemeral keychain
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          brew install xcodegen
          python3 - <<'PY'
          import os,base64,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          (root/'distribution.p12').write_bytes(base64.b64decode(os.environ['IOS_CERTIFICATE_BASE64']))
          (root/'distribution.mobileprovision').write_bytes(base64.b64decode(os.environ['IOS_PROFILE_BASE64']))
          keys=pathlib.Path.home()/'.appstoreconnect/private_keys'; keys.mkdir(parents=True,exist_ok=True)
          (keys/('AuthKey_'+os.environ['ASC_KEY_ID']+'.p8')).write_text(os.environ['ASC_PRIVATE_KEY'])
          PY
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/signing.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/signing.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/signing.keychain-db"
          security import "$RUNNER_TEMP/distribution.p12" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/signing.keychain-db"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/signing.keychain-db" >/dev/null
          security list-keychains -d user -s "$RUNNER_TEMP/signing.keychain-db"
          security cms -D -i "$RUNNER_TEMP/distribution.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          python3 native/prepare_signing.py
      - name: Verify the exact distribution revision
        run: |
          set -euo pipefail
          python3 native/generate_localizations.py
          python3 native/verify_source.py
          xcodegen generate --spec native/project.yml
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for values in d["devices"].values() for x in values if "iPhone" in x["name"]))')
          swift native/make_qa_media.swift "$RUNNER_TEMP/qa-media"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl addmedia "$DEVICE" "$RUNNER_TEMP/qa-media/"*.png
          xcodebuild test -project native/PhotoSweep.xcodeproj -scheme PhotoSweep -parallel-testing-enabled NO -destination "platform=iOS Simulator,id=$DEVICE" -resultBundlePath "$RUNNER_TEMP/DeliveryTests.xcresult" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" CODE_SIGNING_ALLOWED=NO | tee "$RUNNER_TEMP/delivery-tests.log"
      - name: Export simulator screenshots
        if: always()
        run: xcrun xcresulttool export attachments --path "$RUNNER_TEMP/DeliveryTests.xcresult" --output-path "$RUNNER_TEMP/native-captures" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ui-captures
          path: ${{ runner.temp }}/native-captures
          retention-days: 3
      - name: Archive native app
        run: |
          set -euo pipefail
          xcodebuild archive -project native/PhotoSweep.xcodeproj -scheme PhotoSweep -configuration Release -destination generic/platform=iOS -archivePath "$RUNNER_TEMP/PhotoSweep.xcarchive" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" | tee "$RUNNER_TEMP/delivery-archive.log"
          codesign --verify --deep --strict "$RUNNER_TEMP/PhotoSweep.xcarchive/Products/Applications/PhotoSweep.app"
          python3 native/verify_archive.py "$RUNNER_TEMP/PhotoSweep.xcarchive/Products/Applications/PhotoSweep.app" "$BUILD_NUMBER"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/PhotoSweep.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export"
      - name: Upload only to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: xcrun altool --upload-app -f "$RUNNER_TEMP/export/PhotoSweep.ipa" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: native-delivery-diagnostics
          path: ${{ runner.temp }}/delivery-*.log
          retention-days: 3
      - name: Remove temporary signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/distribution.mobileprovision" "$RUNNER_TEMP/profile.plist"
          rm -f "$HOME/.appstoreconnect/private_keys/"*.p8
