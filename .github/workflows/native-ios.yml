name: Native iOS verification
on:
  push:
    branches: ['codex/swiftui-2']
    paths:
      - 'native/PhotoSweep/**'
      - 'native/Tests/**'
      - 'native/UITests/**'
      - 'native/project.yml'
      - 'native/localization.json'
      - 'native/generate_localizations.py'
      - 'native/verify_source.py'
      - 'native/make_qa_media.swift'
      - 'tools/native_harness.py'
      - '.github/workflows/native-ios.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Select required checks
        env:
          NATIVE_BASE_REF: ${{ github.event.before }}
        run: |
          python3 tools/native_harness.py self-test
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            python3 tools/native_harness.py ci --force
          else
            python3 tools/native_harness.py ci --base "$NATIVE_BASE_REF"
          fi
      - name: Generate native project
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          brew install xcodegen
          python3 native/generate_localizations.py
          python3 native/verify_source.py
          xcodebuild -version
          xcodegen generate --spec native/project.yml
      - name: Choose available iPhone simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for values in d["devices"].values() for x in values if "iPhone" in x["name"]))')
          echo "SIMULATOR_ID=$DEVICE" >> "$GITHUB_ENV"
      - name: Native XCTest
        run: |
          set -o pipefail
          TEST_ARGS=()
          if [ "$NATIVE_CHECK_LANE" = "unit" ]; then
            TEST_ARGS+=("-only-testing:PhotoSweepTests")
          else
            swift native/make_qa_media.swift "$RUNNER_TEMP/qa-media"
            xcrun simctl boot "$SIMULATOR_ID" || true
            xcrun simctl bootstatus "$SIMULATOR_ID" -b
            xcrun simctl addmedia "$SIMULATOR_ID" "$RUNNER_TEMP/qa-media/"*.png
          fi
          xcodebuild test -project native/PhotoSweep.xcodeproj -scheme PhotoSweep -parallel-testing-enabled NO -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -resultBundlePath "$RUNNER_TEMP/NativeTests.xcresult" "${TEST_ARGS[@]}" CODE_SIGNING_ALLOWED=NO | tee "$RUNNER_TEMP/native-build.log"
      - name: Release build without signing
        run: |
          set -o pipefail
          xcodebuild build -project native/PhotoSweep.xcodeproj -scheme PhotoSweep -configuration Release -sdk iphoneos -destination generic/platform=iOS CODE_SIGNING_ALLOWED=NO | tee "$RUNNER_TEMP/native-release.log"
      - name: Export UI test captures
        if: always()
        run: xcrun xcresulttool export attachments --path "$RUNNER_TEMP/NativeTests.xcresult" --output-path "$RUNNER_TEMP/native-captures" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-diagnostics
          path: |
            ${{ runner.temp }}/native-*.log
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ui-captures
          path: ${{ runner.temp }}/native-captures
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: native-xcresult
          path: ${{ runner.temp }}/NativeTests.xcresult
          retention-days: 3
