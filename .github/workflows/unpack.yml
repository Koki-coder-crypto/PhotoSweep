name: Unpack PhotoSweep

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack PhotoSweep
        run: |
          rm -rf /tmp/photosweep
          mkdir -p /tmp/photosweep

          unzip -o PhotoSweep-v3.zip -d /tmp/photosweep

          rsync -av \
            --exclude='.github/workflows/' \
            /tmp/photosweep/PhotoSweep-v3/ ./

          rm -f PhotoSweep-v3.zip

      - name: Commit restored project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "fix: restore PhotoSweep project structure" || exit 0
          git push
